<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenFit - Chat Inteligente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand-image-container">
                <img src="/img/lateral.jfif" alt="Halteres de Musculação" class="brand-image">
            </div>
            
            <div id="controles">
                <div class="control-group">
                    <label for="serverSelect">Conectar ao Servidor</label>
                    <div class="select-wrapper">
                        <select id="serverSelect">
                            <option value="local">Local (Porta 5001)</option>
                            <option value="production">Produção (Render)</option>
                        </select>
                    </div>
                </div>
                <button id="iniciarBtn" class="btn btn-start">Iniciar conversa</button>
                <button id="limparBtn" class="btn btn-clear">Limpar tela</button>
                <button id="encerrarBtn" class="btn btn-end">Encerrar conversa</button>
            </div>
        </aside>

        <main class="chat-wrapper">
            <header class="chat-header">
                <div class="bot-info">
                    <img src="/img/logo-removebg-preview.png" alt="GreenFit Logo" class="bot-avatar">
                    <div class="bot-text-wrapper">
                        
                        <span class="bot-subtitle">Assistente Virtual</span>
                    </div>
                </div>
                <div id="connection-status" class="status-online">Conectado</div>
            </header>
            
            <div id="chat-box" class="chat-box">
                <div class="status-row">
                    <div class="status-message">Clique em "Iniciar conversa" para começar.</div>
                </div>
            </div>
            
            <footer class="chat-input-area">
                <input type="text" id="message-input" placeholder="Digite sua mensagem aqui...">
                <button id="send-button">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
                        <path d="M1.946 9.315c-.522-.174-.527-.455.01-.634l20.53-6.844c.526-.175.864.124.713.656l-6.858 20.566c-.18.541-.475.535-.644-.018l-3.385-11.047L1.946 9.315zM12.93 11.07l2.843 9.284 5.253-15.759-15.748 5.249 9.285 2.822 1.367-1.366z"/>
                    </svg>
                    <span>Enviar</span>
                </button>
            </footer>
        </main>
    </div>

    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
